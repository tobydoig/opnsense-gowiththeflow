; "one*" verbs (not plain start/stop/restart) deliberately -- confirmed on
; the real VM that rc.subr's default rc.conf enable-gate (requires
; gowiththeflow_enable=YES in rc.conf) blocks a plain "start", and this
; plugin's model (not FreeBSD's rc.conf) is the single source of truth for
; whether the service should be running -- ApiMutableServiceControllerBase
; already only calls start when the model says enabled, so bypassing
; rc.subr's own separate enable tracking here is correct, not a workaround.
[start]
command:/usr/local/etc/rc.d/gowiththeflow onestart
type:script
message:Starting GoWithTheFlow

[stop]
command:/usr/local/etc/rc.d/gowiththeflow onestop
type:script
message:Stopping GoWithTheFlow

[restart]
command:/usr/local/etc/rc.d/gowiththeflow onerestart
type:script
message:Restarting GoWithTheFlow

[status]
command:/usr/local/etc/rc.d/gowiththeflow onestatus
errors:no
type:script_output
message:Request GoWithTheFlow status

; Parameterized, unlike the four service verbs above -- the IP comes
; from the user's click in the UI. configd single-quotes every %s
; before shell substitution, and block_host.py re-validates with
; ipaddress.ip_address() (blocklist.normalize_ip()) before the value
; ever reaches pfctl or the database, as defense in depth rather than
; the only line of defense. allowed_groups mirrors what core's own
; pf-mutating actions_filter.conf actions carry.
[block]
command:/usr/local/opnsense/scripts/gowiththeflow/block_host.py block --ip
parameters: %s --by %s
type:script_output
message:block host %s
allowed_groups:wheel,wwwonly

[unblock]
command:/usr/local/opnsense/scripts/gowiththeflow/block_host.py unblock --ip
parameters: %s
type:script_output
message:unblock host %s
allowed_groups:wheel,wwwonly

; No parameters -- rewrites the pf table from blocked_hosts.py (the
; source of truth) unconditionally. Used by the daemon's own startup/
; periodic reconcile and available for manual recovery if the table
; ever drifts (e.g. a stale file predating a DB change).
[sync_blocked]
command:/usr/local/opnsense/scripts/gowiththeflow/block_host.py sync
type:script_output
message:resync blocked-host pf table
allowed_groups:wheel,wwwonly
